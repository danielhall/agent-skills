name: Commit messages

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

env:
  COMMITLINT: -p @commitlint/cli@21.2.3 -p @commitlint/config-conventional@21.2.3 commitlint

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Squash merges use the PR title as the commit message, so it must follow the rules too.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx -y $COMMITLINT

      - name: Check the pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          npx -y $COMMITLINT \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"

      - name: Check commits pushed to main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx -y $COMMITLINT --from "${{ github.event.before }}" --to "${{ github.sha }}"
